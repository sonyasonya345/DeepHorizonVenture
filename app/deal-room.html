<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Deal Room 项目库</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: two-pane deal room — pipeline ledger on the left, the project file on the right; stacks on phones */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --sunk:#E9EDEB; --ink:#14201C; --muted:#5A6762; --line:#D9E0DC;
  --accent:#1F5E4F; --accent-ink:#FFFFFF; --accent-soft:#E1EDE8;
  --good:#2E7D4F; --warn:#A86B12; --bad:#B0412B; --info:#2C5A97;
  --good-soft:#E3F1E8; --warn-soft:#F7EDDB; --bad-soft:#F6E3DE; --info-soft:#E2EAF5;
  --f-display:"Noto Serif SC","Songti SC",Georgia,serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --sunk:#111816; --ink:#E4EBE8; --muted:#94A39D; --line:#26312D;
  --accent:#72C2A8; --accent-ink:#0E1412; --accent-soft:#1B2E28;
  --good:#6CC08E; --warn:#E0A84E; --bad:#E58B76; --info:#86AEE6;
  --good-soft:#18291F; --warn-soft:#2D2416; --bad-soft:#2E1B17; --info-soft:#18233A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --sunk:#111816; --ink:#E4EBE8; --muted:#94A39D; --line:#26312D;
  --accent:#72C2A8; --accent-ink:#0E1412; --accent-soft:#1B2E28;
  --good:#6CC08E; --warn:#E0A84E; --bad:#E58B76; --info:#86AEE6;
  --good-soft:#18291F; --warn-soft:#2D2416; --bad-soft:#2E1B17; --info-soft:#18233A; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:340px minmax(0,1fr);height:100%;min-height:0}
/* ---------- left: pipeline ---------- */
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.side-head{padding-block:18px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-family:var(--f-display);font-size:20px;margin:0;letter-spacing:.02em}
.brand small{color:var(--muted);font-size:12px}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.list{overflow:auto;flex:1;min-height:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 16px 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:3px solid transparent;width:100%;text-align:left}
.row:hover{background:var(--sunk)}
.row.on{background:var(--accent-soft);border-left-color:var(--accent)}
.row .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ol{grid-column:1/-1;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.score{font-family:var(--f-mono);font-weight:500;font-size:13px}
.side-foot{padding:12px 16px;border-top:1px solid var(--line)}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:0 8px;font-size:11.5px;line-height:20px;white-space:nowrap}
.st-new{background:var(--info-soft);color:var(--info)}
.st-tracking{background:var(--sunk);color:var(--muted)}
.st-dd{background:var(--warn-soft);color:var(--warn)}
.st-ic{background:var(--accent-soft);color:var(--accent)}
.st-invested{background:var(--good-soft);color:var(--good)}
.st-pass{background:var(--bad-soft);color:var(--bad)}
.tag{background:var(--sunk);color:var(--muted)}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn.full{width:100%;justify-content:center}

/* ---------- right: deal ---------- */
.main{overflow:auto;min-height:0;min-width:0}
.wrap{max-width:980px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.back{display:none}
.dh{display:flex;flex-direction:column;gap:8px}
.dh-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.dh h2{font-family:var(--f-display);font-size:28px;line-height:1.25;margin:0;text-wrap:balance}
.dh .ol{color:var(--muted);font-size:15px;max-width:62ch}
.dh .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dh .stamp{font-size:12px;color:var(--muted)}
select.status{border:1px solid var(--line);border-radius:999px;padding:2px 8px;background:var(--surface);font-size:12.5px}

.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.terms div{padding:10px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0;min-width:0}
.terms dt{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.terms dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.terms dd.empty{color:var(--muted);font-weight:400}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;background:var(--bg);z-index:2}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;color:var(--muted);white-space:nowrap}
.tabname{flex:none;align-self:center;max-width:16em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--ink);padding:6px 14px 6px 2px;margin-right:6px;border-right:1px solid var(--line)}
@media (max-width:600px){.tabname{max-width:9em}}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tab .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:4px}

/* memo */
.memo-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.memo-src{font-size:12.5px;color:var(--muted)}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.scorecard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.big{font-family:var(--f-mono);font-size:36px;line-height:1;font-weight:500}
.big small{font-size:14px;color:var(--muted)}
.rec{margin-top:6px}
.dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 20px}
.dim{display:grid;grid-template-columns:92px minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:12.5px}
.dim .w{color:var(--muted);font-size:11px}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.sec{border-top:1px solid var(--line);padding-top:14px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:8px 24px}
.sec h3{margin:0;font-size:15px;font-family:var(--f-display);line-height:1.4}
.sec h3 .en{display:block;font-family:var(--f-body);font-weight:400;font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.sec h3 .no{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400;margin-right:4px}
.sec .body{min-width:0;max-width:68ch}
.sec .body p{margin:0 0 8px}
.sec .body ul{margin:0 0 8px;padding-left:18px}
.sec .body h4{margin:10px 0 4px;font-size:13.5px}
.sec .hint{color:var(--muted);font-size:13px;font-style:italic}
.sec .tools{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.sec textarea{width:100%;min-height:180px;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);line-height:1.6}
.src{display:inline-block;font-size:11px;line-height:17px;padding:0 6px;border-radius:4px;margin:0 2px;vertical-align:1px;font-weight:500}
.src-bp{background:var(--info-soft);color:var(--info)}
.src-ok{background:var(--good-soft);color:var(--good)}
.src-inf{background:var(--warn-soft);color:var(--warn)}
.src-q{background:var(--bad-soft);color:var(--bad)}

/* files */
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted);background:var(--surface);display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{color:var(--ink)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap}
tr:last-child td{border-bottom:0}
td .fn{font-weight:500;overflow-wrap:anywhere}
.ftype{font-family:var(--f-mono);font-size:11px;padding:1px 5px;border-radius:4px;background:var(--sunk);color:var(--muted);text-transform:uppercase}
.progress{font-size:12.5px;color:var(--muted)}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px}
.msgs{display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(720px,100%);padding:10px 14px;border-radius:var(--r);line-height:1.65}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}
.msg ul{margin:0 0 6px;padding-left:18px}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.msg .act{margin-top:6px;display:flex;gap:6px}
.ask{display:flex;gap:8px;align-items:flex-end}
.ask textarea{flex:1;min-width:0;resize:vertical;min-height:44px;max-height:200px;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.sugs{display:flex;gap:6px;flex-wrap:wrap}

/* comments + history */
.feed{display:flex;flex-direction:column;gap:0}
.item{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item img{width:28px;height:28px;border-radius:50%}
.item .who{font-weight:500;font-size:13px}
.item .when{color:var(--muted);font-size:12px;margin-left:6px}
.item .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.item .txt p{margin:0 0 4px;white-space:normal}
.agent-av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700}
.compose{display:flex;flex-direction:column;gap:8px}
.compose textarea{min-height:80px;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.hist{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.hist .t{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.hist b{font-weight:500}

/* empty */
.empty{max-width:620px;margin:8vh auto 0;display:flex;flex-direction:column;gap:16px}
.empty h2{font-family:var(--f-display);font-size:26px;margin:0}
.steps{display:grid;gap:10px;counter-reset:s}
.steps li{list-style:none;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-mono);width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px}
.steps{padding:0;margin:0}
.note{font-size:12.5px;color:var(--muted)}
.notice{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:13px}

/* intake composer */
.intake{max-width:720px;margin:6vh auto 0;display:flex;flex-direction:column;gap:18px;width:100%}
.ihead h2{font-family:var(--f-display);font-size:26px;margin:0 0 6px}
.ihead p{margin:0;color:var(--muted);max-width:62ch}
.composer{border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px -16px rgba(0,0,0,.18)}
.composer.over{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.composer.busy{opacity:.7}
.composer textarea{border:0;background:transparent;resize:vertical;min-height:120px;padding:14px 16px;line-height:1.6;outline:none}
.composer .chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 12px 0}
.fchip{display:inline-flex;align-items:center;gap:6px;max-width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 6px 4px 8px;font-size:12.5px;min-width:0}
.fchip .fcn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.fchip .x{border:0;background:none;color:var(--muted);font-size:15px;line-height:1;padding:0 4px}
.cbar{display:flex;align-items:center;gap:10px;padding:8px 10px 10px;border-top:1px solid var(--line);flex-wrap:wrap}
.cbar .grow{flex:1}
.prog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.prog li{display:grid;grid-template-columns:16px 1fr;gap:10px;align-items:baseline;color:var(--muted);font-size:13.5px}
.prog .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);transform:translateY(1px)}
.prog li.on{color:var(--ink)}.prog li.on .dot{border-color:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.prog li.done{color:var(--ink)}.prog li.done .dot{background:var(--good);border-color:var(--good)}
.prog li.fail .dot{background:var(--bad);border-color:var(--bad)}
.prog li.skip .dot{background:var(--sunk)}
@keyframes pulse{50%{background:var(--accent-soft)}}
.ihelp{display:flex;flex-direction:column;gap:8px;align-items:flex-start;border-top:1px solid var(--line);padding-top:14px}
.ihelp p{margin:0}

/* glossary terms + tooltip */
.term{border-bottom:1px dotted var(--accent);cursor:help;border-radius:2px}
.term:hover,.term:focus-visible{background:var(--accent-soft)}
.msg.u .term{border-bottom-color:currentColor}
.tip{position:fixed;z-index:40;max-width:min(340px,calc(100vw - 16px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 10px 30px -12px rgba(0,0,0,.35);font-size:13px;line-height:1.55;pointer-events:none}
.tip .tz{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;margin-bottom:6px}
.tip .te{font-weight:400;color:var(--muted);font-size:12.5px}
.tip p{margin:0 0 6px}
.tip .ten{color:var(--muted)}
.tip .tm{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.side-foot{display:flex;flex-direction:column;gap:6px}

/* mode switch + research */
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r);padding:2px;background:var(--bg);gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:6px 8px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
.secgrp{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.sgh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.sgh h3{margin:0;font-family:var(--f-display);font-size:18px}
.sgh .btn{margin-left:auto}
.insight{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;max-width:76ch}
.insight h3,.insight h4{margin:10px 0 4px;font-size:13.5px}
.insight ul{margin:0 0 6px;padding-left:18px}.insight p{margin:0 0 6px}
.pains{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pain{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ph{display:flex;gap:10px;align-items:flex-start}
.pno{flex:none;font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 6px;margin-top:2px;font-variant-numeric:tabular-nums}
.gno{font-family:var(--f-mono);font-size:14px;color:var(--muted);margin-right:8px}
.ph h4{margin:0;font-size:14.5px;line-height:1.45;flex:1;min-width:0}
.pr{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;font-size:13px}
.pr .lb{color:var(--muted);font-size:12px}
.pr.opp span:last-child{color:var(--good);font-weight:500}
.pain blockquote{margin:2px 0;padding:6px 10px;border-left:3px solid var(--line);color:var(--muted);font-size:13px}
.pain blockquote cite{display:block;font-style:normal;font-size:12px;margin-top:2px}
.psrc{border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.sev{display:inline-flex;gap:2px;flex:none;margin-top:5px}.sev i{width:6px;height:10px;border-radius:2px;background:var(--sunk)}.sev i.on{background:var(--warn)}
.x{border:0;background:none;color:var(--muted);font-size:15px;line-height:1;padding:0 4px;cursor:pointer}
.memo-body{max-width:68ch}.memo-body ul{padding-left:18px}

/* intake jobs */
.split{display:flex;align-items:center;gap:8px;padding:0 14px 12px;font-size:13px;color:var(--muted)}
.jobs{display:flex;flex-direction:column;gap:8px}
.job{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.jh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.jh b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%;font-weight:500}
.jst{font-size:12px;border-radius:999px;padding:0 8px;line-height:20px;background:var(--sunk);color:var(--muted)}
.job.running .jst{background:var(--accent-soft);color:var(--accent)}
.job.done .jst{background:var(--good-soft);color:var(--good)}
.job.fail .jst{background:var(--bad-soft);color:var(--bad)}
.jh .grow{flex:1}

/* semi figures */
.figrow{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 4px}

<script>
"use strict";
/* ================= Framework ================= */
const SECTIONS = [
  {k:"tldr",t:"投资要点",en:"Executive Summary",h:"一句话定位；建议 Pass / Track / Deep Dive；最看好的 1 点、最担心的 1 点"},
  {k:"what",t:"业务概述",en:"Business Overview",h:"用大白话讲清：给谁解决什么痛点；现在大家怎么凑合；它的方案好在哪；怎么收钱；一个类比"},
  {k:"whynow",t:"投资时机",en:"Why Now",h:"什么技术、法规或市场变化让这件事现在才做得成"},
  {k:"team",t:"创始团队",en:"Founding Team & Founder–Market Fit",h:"每位创始人履历（交叉验证）；为什么是他们；互补性；是否全职；创始人股权分配与控制权；连续创业 / 退出经历"},
  {k:"product",t:"产品与技术壁垒",en:"Product & Defensibility",h:"产品阶段（idea / demo / MVP / 上线）；技术、数据、网络效应、监管壁垒是真是假"},
  {k:"traction",t:"业务进展",en:"Traction",h:"收入、用户、增长、留存、付费试点 (paid pilot)、意向书 (LOI)；区分「付钱」和「感兴趣」"},
  {k:"market",t:"市场空间",en:"Market Sizing · TAM / SAM / SOM",h:"自下而上 (bottom-up) 重算，不照搬 BP"},
  {k:"competition",t:"竞争格局",en:"Competitive Landscape",h:"直接竞品、大厂下场风险、差异化；竞品融资情况"},
  {k:"model",t:"商业模式与单位经济",en:"Business Model & Unit Economics",h:"定价、毛利、获客成本 (CAC)、客户生命周期价值 (LTV)；没数据就写关键假设"},
  {k:"round",t:"本轮交易条款",en:"Round Terms",h:"融资额、投前 / 投后估值、出让比例、工具（SAFE / priced round / 可转债）、估值上限 (cap)、资金用途、跑道 (runway)、领投方、我们能拿的额度"},
  {k:"investors",t:"股东结构与外部背书",en:"Investors & Validation",h:"历轮融资与投资人质量；政府补助（SBIR / NIH 等）、大厂合作"},
  {k:"geo",t:"地缘政治与合规风险",en:"Geopolitical & Regulatory Risk",h:"美国对华投资限制 (Outbound Investment Rules)、外国投资审查 (CFIUS)、出口管制 (EAR / 实体清单)、数据跨境与安全审查、公司架构 (Cayman / VIE / 美国主体)、团队与资金的中美敞口"},
  {k:"risks",t:"核心风险与关键假设",en:"Key Risks & Critical Assumptions",h:"3–5 个「不成立项目就死」的假设；红旗信号"},
  {k:"next",t:"尽调清单与基金匹配度",en:"Diligence Questions & Fund Fit",h:"下次见创始人的 10 个问题；与我们 thesis 的契合；退出路径；GP 能提供的增值"}
];
const DIMS = [["team","团队",.30],["market","市场",.20],["product","产品与壁垒",.15],["traction","牵引力",.15],["terms","条款与估值",.10],["fit","基金契合度",.10]];
const STATUS = {new:"初筛",tracking:"持续跟踪",dd:"尽职调查",ic:"投委会",invested:"已投资",pass:"放弃"};
const RECS = {"Deep Dive":"st-ic","Track":"st-tracking","Pass":"st-pass"};
const STAGES = ["Pre-seed","Seed","Seed+","Pre-A","A","A+","B","其他"];
const AGENT = "agent";

/* ================= State ================= */
let db=null, user=null, assets=null, sample=null;
let me={id:null}, canWrite=true;
let deals=[], sel=null, tab="memo", filter="all", query="";
let files=[], comments=[], history=[], chatLog=[];
let unsubSub=[];
const names=new Map(), avatars=new Map();
const chats=new Map(); const textCache=new Map();
let editing=null, busy={};
let intake={files:[]}, intakeOpen=false, pickTarget="deal", replaceId=null; const filesDirty=new Set();
const extOf=n=>(String(n).split(".").pop()||"").toLowerCase();

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now=()=>Date.now();
function fmtTime(t){if(!t)return"";const d=new Date(t);const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}
function rel(t){if(!t)return"";const s=(now()-t)/1000;if(s<60)return"刚刚";if(s<3600)return Math.floor(s/60)+" 分钟前";if(s<86400)return Math.floor(s/3600)+" 小时前";if(s<86400*30)return Math.floor(s/86400)+" 天前";return fmtTime(t).slice(0,10)}
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),2600)}
function nameOf(id){if(!id)return"未知";if(id===AGENT)return"Claude 分析助手";if(id===me.id)return(names.get(id)||"我");return names.get(id)||"成员"}
function avatarHTML(id){if(id===AGENT)return `<div class="agent-av" aria-hidden="true">C</div>`;const a=avatars.get(id);return a?`<img src="${esc(a)}" alt="">`:`<div class="agent-av" style="background:var(--sunk);color:var(--muted)">·</div>`}
async function refreshProfiles(ids){
  if(!user)return; const want=[...new Set(ids.filter(x=>x&&x!==AGENT))]; if(!want.length)return;
  let changed=false;
  try{const ps=await user.profiles(want);for(const id of want){const p=ps[id];if(!p)continue;const n=p.name||"";if(names.get(id)!==n){names.set(id,n);changed=true}if(avatars.get(id)!==p.avatarUrl){avatars.set(id,p.avatarUrl);changed=true}}}catch(e){}
  if(changed)render();
}
function weighted(sc){if(!sc)return null;let s=0,w=0;for(const[k,,wt]of DIMS){const v=Number(sc[k]);if(v>0){s+=v*wt;w+=wt}}return w?s/w:null}

/* ================= Markdown-lite ================= */
function srcCls(t){if(/BP|自述/.test(t))return"bp";if(/核实|验证/.test(t))return"ok";if(/推断/.test(t))return"inf";return"q"}
/* ================= Bilingual glossary ================= */
let gloss=[]; const gIdx=new Map(), gZh=new Map(); const glossPending=new Map(), glossTried=new Set(); let glossBusy=false, glossTimer=null, view="deals", gq="";
const unesc=s=>String(s).replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,"&");
const slug=s=>String(s).toLowerCase().replace(/&/g," and ").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80);
const termKey=en=>slug(String(en).split(/[,，;；]/)[0]);
function indexGloss(list){gloss=list;gIdx.clear();gZh.clear();for(const g of list){for(const k of [g.id,slug(g.en||""),slug(g.abbr||"")])if(k)gIdx.set(k,g);if(g.zh)gZh.set(g.zh,g)}}
function lookup(key,zh){return gIdx.get(key)||(zh&&gZh.get(zh))||null}
const TERM_RE=/([一-鿿][一-鿿·]{0,13})\s?[（(]([A-Za-z][A-Za-z0-9 .,'’\-\/+]*?(?:&amp;[A-Za-z0-9 .,'’\-\/+]*?)*)[)）]/g;
function markTerms(s){return s.replace(TERM_RE,(m,zh,en)=>{
  const key=termKey(unesc(en));if(!key)return m;
  let pre="",z=zh;const g0=gIdx.get(key);
  if(g0&&g0.zh&&zh.endsWith(g0.zh)){pre=zh.slice(0,zh.length-g0.zh.length);z=g0.zh}
  else{const i=Math.max(...[..."的是了将把从做让被"].map(c=>zh.lastIndexOf(c)));if(i>=0&&i<zh.length-1){pre=zh.slice(0,i+1);z=zh.slice(i+1)}}
  if(!lookup(key,z))glossPending.set(key,{zh:unesc(z),en:unesc(en)});
  return `${pre}<span class="term" tabindex="0" data-k="${key}" data-zh="${z}" data-en="${en}">${z} (${en})</span>`})}
function glossHint(n){return gloss.slice().sort((a,b)=>(b.source==="user")-(a.source==="user")||(b.at||0)-(a.at||0)).slice(0,n).map(g=>`${g.zh} (${g.en}${g.abbr&&g.abbr!==g.en?", "+g.abbr:""})`).join("；")}
const TERM_RULE=()=>`所有专业术语（生物医药、医疗、科技/AI、投资金融、法律合规领域）在每一节第一次出现时写成「中文 (English)」，有通用缩写时写成「中文 (English Full Name, ABBR)」或「中文 (ABBR)」，例如「逆折叠 (inverse folding)」「获客成本 (CAC)」「新药临床试验申请 (Investigational New Drug, IND)」；同一节再次出现可只写中文或缩写。公司名、人名、产品名不翻译。日常词不要加英文。${gloss.length?"\n优先沿用基金术语表的译法："+glossHint(150):""}`;
function scheduleGloss(){if(glossTimer||glossBusy||!sample||!canWrite||!db||!glossPending.size)return;glossTimer=setTimeout(fillGloss,1500)}
async function fillGloss(){
  glossTimer=null;if(glossBusy)return;
  const batch=[...glossPending.entries()].filter(([k,v])=>!glossTried.has(k)&&!lookup(k,v.zh)).slice(0,25);
  glossPending.clear();if(!batch.length)return;
  glossBusy=true;batch.forEach(([k])=>glossTried.add(k));
  try{
    const r=await sample.json(`为下面这些专业术语写中英双语的简明释义，读者是投资人，不一定懂专业。领域可能是生物医药、医疗、科技/AI、投资/金融、法律/合规。中文部分是从句子里截出来的，可能多带了前面几个无关的字，请给出真正的标准中文术语。\n只输出一个 JSON 数组，每项：{"key":"原样返回","zh":"标准中文术语","en":"English full term","abbr":"通用缩写，没有就空字符串","domain":"生物医药|医疗|科技/AI|投资/金融|法律/合规|其他","zhDef":"中文释义，大白话，不超过 60 字","enDef":"Plain-English definition, at most 35 words"}\n\n术语：\n${batch.map(([k,v])=>`- key=${k}：${v.zh} (${v.en})`).join("\n")}`,{modelTier:"quick"});
    if(Array.isArray(r))for(let i=0;i<r.length;i++){
      const t=r[i]||{};const key=(typeof t.key==="string"&&batch.some(([k])=>k===t.key))?t.key:batch[i]?.[0];if(!key||lookup(key))continue;
      const pick=x=>typeof x==="string"?x.slice(0,400):"";
      try{await db.doc("glossary/"+key).set({zh:pick(t.zh)||batch.find(([k])=>k===key)?.[1].zh||"",en:pick(t.en)||batch.find(([k])=>k===key)?.[1].en||"",abbr:pick(t.abbr),domain:pick(t.domain),zhDef:pick(t.zhDef),enDef:pick(t.enDef),source:"ai",by:me.id||"",at:now()})}catch(e){if(e?.code==="invalid_argument"){canWrite=false;break}}
    }
  }catch(e){console.warn("glossary",e)}
  glossBusy=false;
}
/* tooltip */
const tip=document.createElement("div");tip.className="tip";tip.hidden=true;tip.setAttribute("role","tooltip");tip.id="termTip";document.body.append(tip);
let tipFor=null;
function tipHTML(el){
  const g=lookup(el.dataset.k,unesc(el.dataset.zh));
  if(!g)return `<div class="tz">${el.dataset.zh}<span class="te">${el.dataset.en}</span></div><p class="note">${sample&&canWrite?"释义生成中，稍后再看…":"术语表里还没有这个词。"}</p>`;
  return `<div class="tz">${esc(g.zh)}<span class="te">${esc(g.en)}${g.abbr&&g.abbr!==g.en?` · ${esc(g.abbr)}`:""}</span></div>
    ${g.zhDef?`<p>${esc(g.zhDef)}</p>`:""}${g.enDef?`<p class="ten">${esc(g.enDef)}</p>`:""}
    <div class="tm">${g.domain?esc(g.domain)+" · ":""}${g.source==="user"?"合伙人修订":"AI 生成"}</div>`;
}
function showTip(el){
  tipFor=el;tip.innerHTML=tipHTML(el);tip.hidden=false;el.setAttribute("aria-describedby","termTip");
  const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
  let left=Math.min(Math.max(8,r.left),window.innerWidth-w-8);let top=r.bottom+6;if(top+h>window.innerHeight-8)top=Math.max(8,r.top-h-6);
  tip.style.left=left+"px";tip.style.top=top+"px";
}
function hideTip(){if(tipFor)tipFor.removeAttribute("aria-describedby");tipFor=null;tip.hidden=true}
document.addEventListener("mouseover",e=>{const t=e.target.closest?.(".term");if(t&&t!==tipFor)showTip(t)});
document.addEventListener("mouseout",e=>{const t=e.target.closest?.(".term");if(t&&!t.contains(e.relatedTarget))hideTip()});
document.addEventListener("focusin",e=>{const t=e.target.closest?.(".term");if(t)showTip(t)});
document.addEventListener("focusout",e=>{if(e.target.closest?.(".term"))hideTip()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")hideTip()});
document.addEventListener("scroll",hideTip,true);

function inline(s){return markTerms(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/【(BP自述|BP|已核实|外部已验证|推断|待核实|待问)】/g,(m,t)=>`<span class="src src-${srcCls(t)}">${t}</span>`)}
function md(s){if(!s)return"";const L=esc(s).split("\n");let o="",ul=false;for(const l of L){const li=/^\s*(?:[-•*]|\d+[.、)])\s+(.*)/.exec(l);if(li){if(!ul){o+="<ul>";ul=true}o+="<li>"+inline(li[1])+"</li>";continue}if(ul){o+="</ul>";ul=false}if(/^#{1,4}\s/.test(l)){o+="<h4>"+inline(l.replace(/^#+\s/,""))+"</h4>";continue}if(!l.trim())continue;o+="<p>"+inline(l)+"</p>"}if(ul)o+="</ul>";return o}

/* ================= Render: list ================= */
function renderFilters(){

/* ================= Text extraction ================= */
const NS={a:"http://schemas.openxmlformats.org/drawingml/2006/main",w:"http://schemas.openxmlformats.org/wordprocessingml/2006/main",s:"http://schemas.openxmlformats.org/spreadsheetml/2006/main"};
const STORABLE={pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",txt:"text/plain",md:"text/markdown",csv:"text/csv",json:"application/json"};
function paras(xml,ns,tagP,tagT){const doc=new DOMParser().parseFromString(xml,"application/xml");return [...doc.getElementsByTagNameNS(ns,tagP)].map(p=>[...p.getElementsByTagNameNS(ns,tagT)].map(t=>t.textContent).join("")).filter(Boolean).join("\n")}
async function extractText(file,ext,onp){
  if(ext==="pdf"){
    if(!window.pdfjsLib)return"";
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;const out=[];
    for(let i=1;i<=pdf.numPages;i++){onp&&onp(`读取第 ${i}/${pdf.numPages} 页`);const tc=await(await pdf.getPage(i)).getTextContent();out.push(`--- 第 ${i} 页 ---\n`+tc.items.map(x=>x.str+(x.hasEOL?"\n":" ")).join(""))}
    return out.join("\n\n");
  }
  if(["pptx","docx","xlsx"].includes(ext)){
    if(!window.JSZip)return"";
    const zip=await JSZip.loadAsync(file);
    if(ext==="pptx"){const sl=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>parseInt(a.match(/\d+/))-parseInt(b.match(/\d+/)));const out=[];for(let i=0;i<sl.length;i++){out.push(`--- 第 ${i+1} 页 ---\n`+paras(await zip.file(sl[i]).async("string"),NS.a,"p","t"))}return out.join("\n\n")}
    if(ext==="docx"){const f=zip.file("word/document.xml");return f?paras(await f.async("string"),NS.w,"p","t"):""}
    if(ext==="xlsx"){const f=zip.file("xl/sharedStrings.xml");return f?paras(await f.async("string"),NS.s,"si","t"):""}
  }
  if(["txt","md","csv","json"].includes(ext))return await file.text();
  return "";
}
async function prepFile(file,onp){
  const ext=extOf(file.name);let text="";
  try{text=await extractText(file,ext,onp)}catch(e){console.warn(e)}
  return {name:file.name,ext,size:file.size,text:text||"",file};
}
async function storePrep(id,p,onp,root){
  let assetId=null,textAssetId=null,note="";
  if(p.file){
    if(STORABLE[p.ext]&&p.size<=20*1024*1024){onp&&onp("上传原件…");assetId=(await assets.upload(p.file,{type:STORABLE[p.ext]})).id}
    else if(STORABLE[p.ext])note="原件超过 20MB，只保存了提取的文字";
    else note="该格式只保存提取的文字；想保留版式请另存为 PDF 再上传";
  }else note="粘贴的文字";
  if(p.text.trim()){onp&&onp("保存文字…");textAssetId=(await assets.upload(new Blob([p.text],{type:"text/plain"}),{type:"text/plain"})).id;textCache.set(textAssetId,p.text)}
  else if(!assetId)note="没能提取到文字，也无法保存原件（扫描件请截图上传）";
  else if(p.ext==="pdf")note="未提取到文字（可能是扫描件）";
  await db.doc((root||"deals")+"/"+id).collection("files").add({name:p.name,ext:p.ext,size:p.size,assetId,textAssetId,chars:p.text.length,note,uploadedBy:me.id||"",uploadedAt:now()});
  await logH(id,"上传资料",p.name,root);
}

/* ---- intake job queue: submit several at once, at most 2 run in parallel ---- */
const jobs=[];let jobSeq=0,jobActive=0,splitDeal=false,splitEv=false;const JOB_MAX=2,jobWait=[];
const JOB_STATE={queued:"排队中",running:"处理中",done:"已完成",fail:"未完成"};
function jobRun(fn){const go=async()=>{jobActive++;try{await fn()}catch(e){console.warn(e)}finally{jobActive--;const n=jobWait.shift();if(n)n()}};if(jobActive<JOB_MAX)go();else jobWait.push(go)}
function jobRefresh(job){if(job.kind==="deal"?(mode==="deals"&&!sel&&view==="deals"):job.kind==="semi"?(mode==="semi"&&!smSel&&view==="deals"):(mode==="events"&&!evSel&&view==="deals"))renderMain()}
function newJob(kind,label,steps){const j={id:++jobSeq,kind,label,state:"queued",steps:steps.map(([k,l])=>({k,label:l,state:""})),resultId:null,summary:""};jobs.unshift(j);return j}
function jobStep(job,k,state,detail){const s=job.steps.find(x=>x.k===k);s.state=state;s.detail=detail||"";if(state==="on")job.state="running";jobRefresh(job)}
function jobsHTML(kind){
  const js=jobs.filter(j=>j.kind===kind);if(!js.length)return"";
  return `<div class="jobs">${js.map(j=>`<div class="job ${j.state}"><div class="jh"><b>${esc(j.label)}</b><span class="jst">${JOB_STATE[j.state]}</span><span class="grow"></span>
    ${j.resultId?`<button class="btn ghost" data-${kind==="deal"?"id":"ev"}="${esc(j.resultId)}">查看 →</button>`:""}${j.state==="done"||j.state==="fail"?`<button class="x" data-rmjob="${j.id}" aria-label="移除这条记录">×</button>`:""}</div>
    ${j.state==="done"?(j.summary?`<div class="note">${esc(j.summary)}</div>`:""):`<ol class="prog">${j.steps.map(s=>`<li class="${s.state||""}"><span class="dot" aria-hidden="true"></span><span>${esc(s.label)}${s.detail?`<span class="note"> · ${esc(s.detail)}</span>`:""}</span></li>`).join("")}</ol>`}</div>`).join("")}</div>`;
}
function takeGroups(files,notes,split,notesName){
  const g=split&&files.length>1?files.map(f=>({files:[f],notes:""})):[{files:files.slice(),notes}];
  if(split&&files.length>1&&notes)g.push({files:[],notes});

async function processDeal(job,files,notes){
  const S=(k,st,d)=>jobStep(job,k,st,d);
  const preps=[];
  for(const f of files){S("ex","on",f.name);preps.push(await prepFile(f,m=>S("ex","on",`${f.name} · ${m}`)))}

  const chars=preps.reduce((a,p)=>a+p.text.length,0);
  S("ex","done",`${preps.length} 份材料，约 ${chars>=1000?(chars/1000).toFixed(1)+"k":chars} 字`);
  let r=null;
  if(sample&&chars>0){
    S("ai","on","通常需要 1–2 分钟");
    try{r=await sample.json(buildPrompt("（新项目，名称和基本信息请从材料中识别）",packTexts(preps,170000)),{modelTier:"complex"});if(!r||typeof r!=="object"||!r.memo)throw{code:"invalid_json"};S("ai","done")}
    catch(e){console.warn(e);r=null;S("ai","fail",errCopy(e)+"，建档后可在备忘录里重试")}
  }else S("ai","skip",sample?"材料里没有可读的文字":"AI 在当前视图不可用");
  S("save","on");
  try{
    const ref=db.collection("deals").doc();
    const base={name:(r&&String(r.name||"").trim())||guessName(preps),status:"new",scores:{},memo:{},round:{},createdBy:me.id||"",createdAt:now(),updatedBy:me.id||"",updatedAt:now()};
    await ref.set(base);job.resultId=ref.id;
    await logH(ref.id,"创建项目",files.length?`拖入 ${files.length} 份资料${notes?"，并粘贴了介绍":""}`:"粘贴项目介绍");
    for(const p of preps){S("save","on",p.name);try{await storePrep(ref.id,p)}catch(e){console.warn(e);toast(`${p.name} 保存失败`)}}
    if(r)await applyAnalysis({id:ref.id,...base},r,preps.filter(p=>p.text).length);
    else await touch(ref.id);
    S("save","done");job.state="done";job.label=base.name;job.summary=r?"投资备忘录已生成":"已建档，可在备忘录中点击「生成初步分析」";
    toast(`已建档：${base.name}`);
  }catch(e){S("save","fail");job.state="fail";writeErr(e)}
  jobRefresh(job);
}

async function getText(id){if(textCache.has(id))return textCache.get(id);try{const t=await(await fetch("/_blob/"+id)).text();textCache.set(id,t);return t}catch(e){return""}}
const enc=new TextEncoder();
function packTexts(list,budget){
  let out="",used=0;
  for(const f of list){
    if(!f.text||!f.text.trim())continue;let t=f.text;
    const head=`\n\n=== 资料：${f.name} ===\n`;const room=budget-used-enc.encode(head).length;if(room<2000)break;
    let b=enc.encode(t);if(b.length>room){t=new TextDecoder().decode(b.slice(0,room)).replace(/\uFFFD+$/,"")+"\n[……已截断]"}
    out+=head+t;used+=enc.encode(head+t).length;
  }
  return out;
}
async function materials(budget){
  const list=[];
  for(const f of files.slice().sort((a,b)=>(a.uploadedAt||0)-(b.uploadedAt||0))){if(f.textAssetId)list.push({name:f.name,text:await getText(f.textAssetId)})}
  return packTexts(list,budget);
}

}

function buildPrompt(summary,mats){
  const spec=SECTIONS.map(s=>`- ${s.k}（${s.t} / ${s.en}）：${s.h}`).join("\n");
  return `你是一位资深早期风投分析师，为下面这支基金做项目初筛和信息梳理。\n${FUND}\n\n请只根据下方提供的项目材料（你无法联网），先识别公司基本信息和本轮融资条款，再按框架输出分析。要求：\n1. 中文为主。${TERM_RULE()}\n2. 「大白话」一节要让完全不懂行的人也能看懂，并给一个类比。\n3. 每个关键事实前加来源标签：【BP自述】=材料里公司自己说的；【推断】=你的推理；【待核实】=材料没提供、需要问创始人或外部核实的。你不能联网，所以不要使用【已核实】。\n4. 每节用「- 」列表，每节不超过 220 字；信息缺失就直接写缺什么。\n5. 评分 1–5 分（5 最好），信息不足的维度打保守分。\n6. 基本信息和条款字段只填材料里明确出现的内容（可以附单位，如 "$3M"、"$15M pre"），没有就留空字符串，不要猜。\n\n框架各节：\n${spec}\n\n只输出一个 JSON 对象，结构如下：\n{"name":"公司名（英文名和中文名都有就写「English 中文」）","oneLiner":"一句话大白话介绍","sector":"赛道","stage":"轮次，如 Pre-seed / Seed / Pre-A / A","website":"","round":{"raise":"本轮融资额","preMoney":"投前估值","dilution":"出让比例","instrument":"融资工具","lead":"领投方","existing":"已有投资人"},"scores":{"team":0,"market":0,"product":0,"traction":0,"terms":0,"fit":0},"recommendation":"Pass|Track|Deep Dive","memo":{${SECTIONS.map(s=>`"${s.k}":"…"`).join(",")}}}\n\n=== 项目基本信息 ===\n${summary}\n\n=== 项目材料 ===${mats}`;
}
async function applyAnalysis(d,r,nFiles,fresh){
  const memo={},memoMeta={};for(const s of SECTIONS){if(typeof r.memo?.[s.k]==="string"){memo[s.k]=r.memo[s.k];memoMeta[s.k]={by:AGENT,at:now()}}}
  const round=fresh?{}:{...(d.round||{})};for(const k of ["raise","preMoney","dilution","instrument","lead","existing"]){if(fresh)round[k]=r.round?.[k]?String(r.round[k]):"";else if(!round[k]&&r.round?.[k])round[k]=String(r.round[k])}
  const scores={};for(const[k]of DIMS){const x=Math.round(Number(r.scores?.[k]));scores[k]=x>=1&&x<=5?x:0}
  const upd={memo,memoMeta,round,scores,memoSource:"AI 基于上传材料的初步分析（未联网核实）",memoAt:now()};
  if(Object.keys(RECS).includes(r.recommendation))upd.recommendation=r.recommendation;
  for(const k of ["oneLiner","sector","stage","website"]){if((fresh||!d[k])&&r[k])upd[k]=String(r[k])}
  await touch(d.id,upd);await logH(d.id,fresh?"按现有资料重新分析":"运行 AI 初步分析",`基于 ${nFiles} 份资料${fresh?"重新识别基本信息和条款（已覆盖旧结论）":"识别基本信息"}、生成 Memo 和评分`);
}

let chatCtl=null;
async function sendChat(text){
  const d=deals.find(x=>x.id===sel);if(!d||!sample||!text.trim()||busy.chat)return;
  const t=chats.get(d.id)||[];chats.set(d.id,t);
  const t0q=text.trim();t.push({role:"user",content:t0q});const a={role:"assistant",content:"思考中…",pending:true};t.push(a);
  busy.chat=true;renderMain();
  try{
    const mats=await materials(150000);
    const rules=`你是这支风投基金的项目分析助手。${FUND}\n请只根据下面的项目信息和资料回答合伙人的问题，中文为主。${TERM_RULE()}\n区分「材料里公司自己说的」【BP自述】、「你的推断」【推断】和「材料里没有、需要核实的」【待核实】。答案简洁、具体，必要时用「- 」列表。资料里没有的不要编造，直接说不知道并建议去问创始人什么。\n\n=== 项目信息与 Memo ===\n${dealSummary(d)}\n\n=== 资料 ===${mats||"\n（还没有上传资料）"}`;
    const hist=chatMsgs(d).filter(m=>!m.pending&&m.content).slice(-21);
    const turns=[{role:"user",content:rules},{role:"assistant",content:"好的，我已读完这个项目的资料，请提问。"},...hist.map(m=>({role:m.role,content:m.content}))];
    chatCtl=new AbortController();
    const r=await sample(turns,{cache:false,signal:chatCtl.signal,onText:({text})=>{a.content=text;const el=$("#msgs");if(el&&el.lastElementChild){el.lastElementChild.innerHTML=md(text);scrollChat()}}});
    a.content=r.text+(r.truncated?"\n\n（回答被截断，可以让我接着说）":"");
  }catch(e){a.content=(e?.text||"")+(e?.code==="cancelled"?"\n（已停止）":e?.code==="not_granted"?"没有获得 AI 使用授权。":e?.code==="rate_limited"?"请求太频繁，请稍后再试。":"\n（回答没有完成，请再试一次）")}
  a.pending=false;busy.chat=false;chatCtl=null;
  const ok=a.content&&!/（回答没有完成|没有获得 AI 使用授权|请求太频繁/.test(a.content);
  if(ok&&db){try{await dealRef(d.id).collection("chat").add({q:t[t.length-2].content,a:a.content,by:me.id||"",at:now()});t.splice(t.length-2,2);await logH(d.id,"智能问答",t0q.slice(0,40))}catch(e){console.warn(e);toast("问答没能保存（可能没有编辑权限）")}}
  if(sel===d.id&&tab==="chat")renderMain();
}

function evPrompt(texts){
  return `你是一支美元早期风投基金的行业研究员。${FUND}\n下面是 GP 参加会议、峰会或闭门会时记的笔记（可能零散、中英混杂、有缩写；也可能附有现场照片）。请提取结构化信息，用于早期行业投研。\n要求：\n1. 只根据笔记和照片内容，不要编造；没有的字段留空字符串。人名、公司名保持原文写法。\n2. 中文为主。${TERM_RULE()}\n3. 行业痛点 (pain points) 是重点：尽量提全，每条要具体——谁在痛、在哪个环节、因为什么、造成什么损失，不要写成空泛口号；能对应到原话的给出 quote。severity 1–5 按笔记体现的紧迫程度和普遍程度打分。opportunity 写「什么样的公司可以解决、值得投」。\n4. sector 优先从这些里选：${SECTORS.join("、")}；都不合适时可以自拟简短的行业名。同一行业的写法要统一。\n5. 公司线索的 fit 是与我们基金投资方向的匹配度：高 / 中 / 低，并用一句话说明理由。\n只输出一个 JSON 对象：\n{"event":{"name":"会议名称","date":"YYYY-MM-DD，没有就空","location":"","type":"${EV_TYPES.join("|")}"},"summary":"3–8 条会议核心要点，每条以「- 」开头，用换行分隔","themes":["反复出现的主题，3–6 个短语"],"pains":[{"sector":"","pain":"一句话痛点","who":"谁在痛（角色或机构类型）","detail":"具体表现与原因","quote":"原话，没有就空","speaker":"谁提到的，没有就空","severity":3,"current":"现在怎么凑合解决","opportunity":"投资机会"}],"companies":[{"name":"","sector":"","what":"大白话一句话说清在做什么","stage":"","signals":"笔记中提到的进展、融资、客户等信号","website":"","fit":"高|中|低","fitReason":""}],"people":[{"name":"","title":"","org":"","role":"演讲嘉宾|圆桌嘉宾|创始人|投资人|企业高管|学者|其他","takeaways":"核心观点","followUp":"值得跟进的点，没有就空"}]}\n\n=== 会议笔记 ===${texts||"\n（只有照片）"}`;
}
function cleanArr(a,keys){return Array.isArray(a)?a.filter(x=>x&&typeof x==="object").map(x=>{const o={};for(const k of keys)o[k]=k==="severity"?Math.max(0,Math.min(5,Math.round(Number(x[k])||0))):(typeof x[k]==="string"?x[k].slice(0,1200):"");return o}).filter(o=>Object.values(o).some(v=>v)):[]}
function extractionFields(r){
  return {summary:typeof r.summary==="string"?r.summary:"",themes:Array.isArray(r.themes)?r.themes.filter(t=>typeof t==="string").slice(0,8):[],
    pains:cleanArr(r.pains,["sector","pain","who","detail","quote","speaker","severity","current","opportunity"]).filter(p=>p.pain),
    companies:cleanArr(r.companies,["name","sector","what","stage","signals","website","fit","fitReason"]).filter(c=>c.name),
    people:cleanArr(r.people,["name","title","org","role","takeaways","followUp"]).filter(p=>p.name)};
}
async function runEvExtract(texts,images){
  const opts={modelTier:"complex"};
  if(images&&images.length){try{const lim=(await sample.limits()).images;if(lim){opts.images=images.filter(f=>(!lim.maxInputBytes||f.size<=lim.maxInputBytes)&&(!lim.mediaTypes||!f.type||lim.mediaTypes.includes(f.type))).slice(0,lim.maxCount||4)}}catch(e){}}
  const r=await sample.json(evPrompt(texts),opts);
  if(!r||typeof r!=="object")throw{code:"invalid_json"};
  return r;
}
const IMG=new Set(["png","jpg","jpeg","webp","gif"]);
function addEvFiles(list){const seen=new Set(evIntake.files.map(f=>f.name+f.size));for(const f of list){if(!seen.has(f.name+f.size))evIntake.files.push(f)}evOpen=true;renderMain()}
function runEvIntake(){
  const notes=($("#evNotes")?.value||"").trim();
  if(!evIntake.files.length&&!notes){toast("先添加文件，或粘贴会议笔记");return}
  const groups=takeGroups(evIntake.files,notes,splitEv,"粘贴的会议笔记");
  evIntake={files:[]};const ta=$("#evNotes");if(ta)ta.value="";
  for(const g of groups){const job=newJob("event",g.label,[["ex","读取笔记"],["ai","提取人物、公司和行业痛点"],["save","归档"]]);jobRun(()=>processEvent(job,g.files,g.notes))}
  renderMain();toast(groups.length>1?`已提交 ${groups.length} 场会议，最多同时处理 2 场`:"已提交，可以继续添加下一场");
}
async function processEvent(job,files,notes){
  const S=(k,st,d)=>jobStep(job,k,st,d);
  const preps=[];
  for(const f of files){S("ex","on",f.name);preps.push(await prepFile(f,m=>S("ex","on",`${f.name} · ${m}`)))}
  if(notes)preps.push({name:"会议笔记（粘贴）.txt",ext:"txt",size:notes.length,text:notes,file:null});
  const imgs=preps.filter(p=>p.file&&IMG.has(p.ext)).map(p=>p.file);
  const texts=packTexts(preps,200000);
  S("ex","done",`${preps.length} 份材料${imgs.length?`，含 ${imgs.length} 张照片`:""}`);
  let r=null;
  if(sample&&(texts.trim()||imgs.length)){
    S("ai","on","通常需要 1–2 分钟");
    try{r=await runEvExtract(texts,imgs);S("ai","done")}catch(e){console.warn(e);S("ai","fail",errCopy(e)+"，归档后可点「重新提取」")}
  }else S("ai","skip",sample?"没有可读的内容":"AI 在当前视图不可用");
  S("save","on");
  try{
    const ref=db.collection("events").doc();const ev=r?.event||{};
    const base={name:String(ev.name||"").trim()||guessName(preps).replace(/^新项目/,"会议"),date:/^\d{4}-\d{2}-\d{2}$/.test(ev.date||"")?ev.date:"",location:String(ev.location||""),type:EV_TYPES.includes(ev.type)?ev.type:"",
      summary:"",themes:[],pains:[],companies:[],people:[],createdBy:me.id||"",createdAt:now(),updatedBy:me.id||"",updatedAt:now(),...(r?{...extractionFields(r),extractedAt:now()}:{})};
    await ref.set(base);job.resultId=ref.id;
    for(const p of preps){S("save","on",p.name);try{await storePrep(ref.id,p,null,"events")}catch(e){console.warn(e);toast(`${p.name} 保存失败`)}}
    S("save","done");job.state="done";job.label=base.name;
    job.summary=r?`${base.pains.length} 条痛点 · ${base.companies.length} 家公司 · ${base.people.length} 位人物`:"已归档，可在会议页点「重新提取」";
    toast(`已归档：${base.name}`);
  }catch(e){S("save","fail");job.state="fail";writeErr(e)}
  jobRefresh(job);
}
async function redoEvent(e){
  if(!sample||evBusy.redo)return;evBusy.redo=true;renderMain();
  try{
    const list=[];const imgs=[];
    for(const f of evFiles.slice().sort((a,b)=>(a.uploadedAt||0)-(b.uploadedAt||0))){
      if(f.textAssetId)list.push({name:f.name,text:await getText(f.textAssetId)});
      else if(f.assetId&&IMG.has(f.ext)){try{imgs.push(await(await fetch("/_blob/"+f.assetId)).blob())}catch(x){}}
    }
    const r=await runEvExtract(packTexts(list,200000),imgs);
    await db.doc("events/"+e.id).update({...extractionFields(r),extractedAt:now(),updatedAt:now(),updatedBy:me.id||""});
    toast("已重新提取");
  }catch(x){console.warn(x);toast(errCopy(x))}
  evBusy.redo=false;renderMain();
}
async function genInsight(sector){
  if(!sample||evBusy["ins:"+sector])return;
  const ps=allItems("pains").filter(p=>(p.sector||"其他")===sector);if(!ps.length)return;
  evBusy["ins:"+sector]=true;renderMain();
  try{
    const lines=ps.map(p=>`- [${p._ev.name||""} ${evDate(p._ev)}] 痛点：${p.pain}｜谁：${p.who}｜表现：${p.detail}｜原话：${p.quote}｜现有方案：${p.current}｜机会：${p.opportunity}｜紧迫度 ${p.severity}`).join("\n");
    const {text}=await sample(`你是一支美元早期风投基金的行业研究负责人。${FUND}\n下面是我们在多场会议中收集到的「${sector}」行业痛点。请跨会议归纳，写一份简明的行业洞察，帮助 GP 判断这个行业值得投什么。\n中文为主。${TERM_RULE()}\n结构（每部分用「- 」列表，总长不超过 600 字）：\n### 共性痛点（按出现频次和紧迫度排序，注明被几场会议提到）\n### 被忽视或新出现的痛点\n### 现有解决方案的缺口\n### 值得寻找的公司画像（3 条以内，具体到产品形态和客户）\n### 下一步投研问题\n只根据下面的材料，不要编造数据。\n\n${lines}`,{modelTier:"complex",cache:false});
    await db.doc("research/"+hashId(sector)).set({sector,text,n:ps.length,by:me.id||"",at:now()});
  }catch(x){console.warn(x);toast(errCopy(x))}
  evBusy["ins:"+sector]=false;renderMain();
}

}
async function leadToDeal(evId,idx){
  const e=events.find(x=>x.id===evId);const c=e?.companies?.[idx];if(!c)return;
  try{
    const ref=db.collection("deals").doc();
    await ref.set({name:c.name,oneLiner:c.what||"",sector:c.sector||"",stage:c.stage||"",website:c.website||"",status:"new",scores:{},memo:{},round:{},
      sourceEvent:{id:e.id,name:e.name||""},createdBy:me.id||"",createdAt:now(),updatedBy:me.id||"",updatedAt:now()});
    await logH(ref.id,"从会议线索创建",`${e.name||""}${c.signals?"：" + c.signals.slice(0,60):""}`);
    const arr=e.companies.slice();arr[idx]={...c,dealId:ref.id};
    await db.doc("events/"+e.id).update({companies:arr,updatedAt:now(),updatedBy:me.id||""});
    toast(`已加入项目库：${c.name}`);
  }catch(x){writeErr(x)}
}

function tpInitials(n){const w=String(n||"").trim().split(/\s+/);return ((w[0]||"")[0]||"")+((w.length>1?w[w.length-1][0]:"")||"")}
function tpHue(n){let h=0;for(const c of String(n||""))h=(h*31+c.codePointAt(0))%360;return h}
function tpAvatar(t,size,editable){
  const img=t.photoId?`<img src="/_blob/${esc(t.photoId)}" alt="${esc(t.name)}" loading="lazy" onerror="this.remove()">`:"";
  return `<span class="tav${editable?" ed":""}" style="--s:${size}px;--h:${tpHue(t.name)}" ${editable?`role="button" tabindex="0" id="tpPhotoBtn" title="点击或拖入照片更换（也可以直接 Cmd+V 粘贴）"`:""}><span class="ini">${esc(tpInitials(t.name).toUpperCase())}</span>${img}</span>`;
}

function safeUrl(u){return /^https?:\/\//.test(String(u||""))?String(u):""}
const TP_URL_RE=/https?:\/\/[^\s<>"'）)，,]+/g;
function tpUrls(text){return [...new Set((String(text).match(TP_URL_RE)||[]).map(u=>u.replace(/[.。;；]+$/,"")))]}
function tpLinkOnly(text){const rest=String(text).replace(TP_URL_RE," ").replace(/\s+/g,"");return tpUrls(text).length>0&&rest.length<=60}
function tpNameFromUrl(u){try{const x=new URL(u);const segs=x.pathname.split("/").filter(Boolean);let c=/linkedin\.com$/.test(x.hostname.replace(/^www\./,""))&&segs[0]==="in"?segs[1]:(segs.reverse().find(z=>/^~?[a-z][a-z.\-_]+$/i.test(z)&&!/^(people|team|profile|profiles|index|about|en|zh|home)(\.html?)?$/i.test(z))||"");
  c=decodeURIComponent(c||"").replace(/^~/,"").replace(/\.(html?|php|aspx?)$/i,"").replace(/-[0-9a-f]{6,}$/i,"").replace(/[-_.]+/g," ").trim();
  return c?c.replace(/\b\w/g,m=>m.toUpperCase()):""}catch(e){return""}}

function talentHTML(){

function smPrompt(texts){
  const pair='{"zh":"中文","en":"English"}';
  return `你是一支美元早期风投基金的半导体行业研究员。${FUND}\n下面是一期半导体行业分析报告（例如 SemiAnalysis 的文章），请提取重要信息，生成中英双语的结构化摘要，帮助 GP 做早期投研。\n要求：\n1. 只根据原文，不要编造；原文没有的字段留空字符串或空数组。数字保留原文单位和口径。\n2. 中文部分：${TERM_RULE()}\n3. 英文部分用简洁专业的英文，不要逐字翻译中文。\n4. keyPoints 6–10 条，按重要性排序，每条一句话，具体到公司、技术和数字。\n5. implications 写 3–5 条「对早期（种子到 A 轮）投资的启示」：哪些环节会出现创业机会、哪些方向要回避、该去找什么样的公司。\n6. segments 从这些里选 1–4 个：${SM_SEGS.join("、")}。\n7. date 用 YYYY-MM-DD；原文只有月份就写当月 1 日；找不到就空。\n只输出一个 JSON 对象：\n{"title":"中文标题","titleEn":"原文英文标题","source":"如 SemiAnalysis","author":"","date":"","url":"原文中出现的文章链接，没有就空","segments":[],"oneLinerZh":"","oneLinerEn":"","keyPoints":[${pair}],"dataPoints":[{"metricZh":"","metricEn":"","value":"数值和单位","contextZh":"","contextEn":""}],"companies":[{"name":"","ticker":"","role":"如 晶圆代工 / HBM 供应商 / 云厂商","takeawayZh":"","takeawayEn":""}],"implications":[${pair}],"risks":[${pair}]}\n\n=== 报告原文 ===${texts}`;
}
function smFields(r){
  const st=x=>typeof x==="string"?x.slice(0,2000):"";
  const pairs=a=>Array.isArray(a)?a.filter(x=>x&&typeof x==="object").map(x=>({zh:st(x.zh),en:st(x.en)})).filter(x=>x.zh||x.en).slice(0,15):[];
  const objs=(a,keys)=>Array.isArray(a)?a.filter(x=>x&&typeof x==="object").map(x=>Object.fromEntries(keys.map(k=>[k,st(x[k])]))).filter(o=>Object.values(o).some(Boolean)).slice(0,40):[];
  return {title:st(r.title),titleEn:st(r.titleEn),source:st(r.source),author:st(r.author),date:/^\d{4}-\d{2}-\d{2}$/.test(r.date||"")?r.date:"",url:safeUrl(r.url),
    segments:Array.isArray(r.segments)?r.segments.filter(x=>typeof x==="string").slice(0,5):[],oneLinerZh:st(r.oneLinerZh),oneLinerEn:st(r.oneLinerEn),
    keyPoints:pairs(r.keyPoints),implications:pairs(r.implications),risks:pairs(r.risks),
    dataPoints:objs(r.dataPoints,["metricZh","metricEn","value","contextZh","contextEn"]),companies:objs(r.companies,["name","ticker","role","takeawayZh","takeawayEn"])};
}

  if(t.id==="tpEdit"){const x=talent.find(y=>y.id===tpSel);if(x)openTpDialog(x);return}
  if(t.id==="tpResearch"){const x=talent.find(y=>y.id===tpSel);if(!x||!canWrite)return;try{await db.doc("talent/"+x.id).update({research:"queued",researchUrl:x.researchUrl||x.linkedin||x.profileUrl||"",researchRequestedAt:now(),researchRequestedBy:me.id||"",updatedBy:me.id||"",updatedAt:now()});toast("已交给研究 Agent，完成后自动更新")}catch(x){writeErr(x)}return}
  if(t.id==="tpDel"){if(t.dataset.armed!=="1"){t.dataset.armed="1";t.textContent="确认删除";setTimeout(()=>{if(t.isConnected){t.dataset.armed="";t.textContent="删除"}},3000);return}
    try{await db.doc("talent/"+tpSel).delete();tpSel=null;render();toast("已删除")}catch(x){writeErr(x)}return}
  if(t.dataset.ev){if(mode!=="events"){mode="events";setMode("events")}view="deals";selectEvent(t.dataset.ev);return}
  if(t.id==="evBack"){evSel=null;evOpen=false;if(evUnsub){evUnsub();evUnsub=null}render();return}
  if(t.dataset.etab){evTab=t.dataset.etab;renderMain();return}
  if(t.dataset.rtab){resTab=t.dataset.rtab;renderMain();return}
  if(t.dataset.sec!==undefined){resSector=t.dataset.sec;renderMain();return}
  if(t.id==="evPick"){pickTarget="ev";$("#fileInput").click();return}
  if(t.id==="evGo"){runEvIntake();return}
  if(t.dataset.rmjob){const i=jobs.findIndex(j=>j.id===+t.dataset.rmjob);if(i>=0)jobs.splice(i,1);renderMain();return}
  if(t.dataset.rmev){evIntake.files.splice(+t.dataset.rmev,1);renderMain();return}
  if(t.dataset.insight){genInsight(t.dataset.insight);return}
  if(t.dataset.delitem){const[a,b,c]=t.dataset.delitem.split("|");if(t.dataset.armed!=="1"){t.dataset.armed="1";t.textContent="确认";setTimeout(()=>{if(t.isConnected){t.dataset.armed="";t.textContent="×"}},3000);return}delItem(a,b,+c);return}
  if(t.dataset.todeal){const[a,b]=t.dataset.todeal.split("|");t.disabled=true;leadToDeal(a,+b);return}
  if(t.id==="evEdit"){const ev=events.find(x=>x.id===evSel);if(ev)openEvDialog(ev);return}
  if(t.id==="evRedo"){const ev=events.find(x=>x.id===evSel);if(ev){if(t.dataset.armed!=="1"){t.dataset.armed="1";t.textContent="将覆盖已提取内容，再次点击确认";setTimeout(()=>{if(t.isConnected){t.dataset.armed="";t.textContent="重新提取"}},4000);return}redoEvent(ev)}return}
  if(t.dataset.id){if(mode!=="deals")setMode("deals");if(view!=="deals"){view="deals";if(sel===t.dataset.id){render();return}}selectDeal(t.dataset.id);return}
  if(t.id==="openGloss"){view="glossary";render();return}
  if(t.id==="glossBack"){view="deals";render();return}
  if(t.dataset.gedit!==undefined){openGlossDialog(t.dataset.gedit?gloss.find(g=>g.id===t.dataset.gedit):null);return}
  if(t.id==="newDeal"&&mode==="semi"){view="deals";smSel=null;smOpen=true;if(smUnsub){smUnsub();smUnsub=null}render();$("#smNotes")?.focus();return}
  if(t.id==="newDeal"&&mode==="talent"){if(!canWrite){toast("你没有编辑权限");return}tpSel=null;tpOpen=true;render();openTpDialog(null);return}
  if(t.id==="newDeal"&&mode==="events"){view="deals";evSel=null;evOpen=true;if(evUnsub){evUnsub();evUnsub=null}render();$("#evNotes")?.focus();return}
  if(t.id==="newDeal"){view="deals";if(!canWrite){toast("你没有新建权限");return}if(!db){toast("项目库还没连接上");return}
    sel=null;intakeOpen=true;try{localStorage.setItem("dr.sel","")}catch(e){}unsubSub.forEach(u=>u());unsubSub=[];render();$("#intakeNotes")?.focus();return}
  if(t.id==="manualNew"){openDialog(null);return}
  if(t.id==="intakePick"){pickTarget="intake";$("#fileInput").click();return}
  if(t.id==="intakeGo"){runIntake();return}
  if(t.dataset.rmf){intake.files.splice(+t.dataset.rmf,1);renderMain();return}
  if(t.id==="back"){view="deals";sel=null;intakeOpen=false;try{localStorage.setItem("dr.sel","")}catch(e){}unsubSub.forEach(u=>u());unsubSub=[];render();return}
  if(t.dataset.tab){tab=t.dataset.tab;editing=null;renderMain();if(tab==="chat")$("#askBox")?.focus();return}
  const d=deals.find(x=>x.id===sel);
  if(t.id==="editBasics"&&d){openDialog(d);return}
  if(t.dataset.edit){editing=t.dataset.edit;renderMain();$("#edText")?.focus();return}
  if(t.dataset.cancel){editing=null;renderMain();return}
  if(t.dataset.save&&d){const k=t.dataset.save,v=$("#edText").value;t.disabled=true;
    try{await touch(d.id,{memo:{[k]:v},memoMeta:{[k]:{by:me.id||"",at:now()}}});await logH(d.id,"编辑 Memo",SECTIONS.find(s=>s.k===k).t);editing=null;renderMain()}catch(err){t.disabled=false;writeErr(err)}return}
  if(t.id==="aiAnalyze"&&d){
    const has=SECTIONS.some(s=>d.memo?.[s.k]);
    if(has&&t.dataset.armed!=="1"){t.dataset.armed="1";t.textContent="将覆盖现有备忘录，再次点击确认";setTimeout(()=>{if(t.isConnected){t.dataset.armed="";t.textContent="重新生成分析"}},4000);return}
    analyze(d);return}
  if(t.id==="pick"){pickTarget="deal";$("#fileInput").click();return}
  if(t.dataset.frep){replaceId=t.dataset.frep;pickTarget="replace";$("#fileInput").click();return}
  if(t.dataset.fdel||t.dataset.fsplit){
    const del=!!t.dataset.fdel,fid=t.dataset.fdel||t.dataset.fsplit;
    if(t.dataset.armed!=="1"){const old=t.textContent;t.dataset.armed="1";t.textContent=del?"确认删除？":"确认拆出？";setTimeout(()=>{if(t.isConnected){t.dataset.armed="";t.textContent=old}},4000);return}
    t.disabled=true;if(del)await deleteFile(fid);else await splitFile(fid);return}
  if(t.id==="reprocess"&&d){analyze(d,true);return}
  if(t.id==="sendChat"){const b=$("#askBox");const v=b.value;b.value="";sendChat(v);return}
  if(t.id==="stopChat"){chatCtl?.abort();return}
  if(t.dataset.sug){sendChat(t.dataset.sug);return}
  if(t.dataset.delchat&&d){if(t.dataset.armed!=="1"){t.dataset.armed="1";t.textContent="确认删除？";setTimeout(()=>{if(t.isConnected){t.dataset.armed="";t.textContent="删除这条问答"}},4000);return}
    t.disabled=true;try{await dealRef(d.id).collection("chat").doc(t.dataset.delchat).delete()}catch(err){writeErr(err)}return}
  if(t.dataset.savechat&&d){const cm=chatMsgs(d);const m=cm[+t.dataset.savechat];const q=cm[+t.dataset.savechat-1];if(!m)return;t.disabled=true;
    try{await dealRef(d.id).collection("comments").add({text:(q?`**问：**${q.content}\n\n`:"")+m.content,fromChat:true,by:me.id||"",at:now()});await touch(d.id);await logH(d.id,"保存 AI 对话到讨论",(q?.content||"").slice(0,40));t.textContent="已保存"}catch(err){t.disabled=false;writeErr(err)}return}
  if(t.id==="postC"&&d){const b=$("#cBox");const v=b.value.trim();if(!v)return;t.disabled=true;
    try{await dealRef(d.id).collection("comments").add({text:v,by:me.id||"",at:now()});await touch(d.id);await logH(d.id,"发表讨论",v.slice(0,40));b.value=""}catch(err){writeErr(err)}t.disabled=false;return}
});
document.addEventListener("click",e=>{const sc=e.target.closest(".smcard");if(sc&&!e.target.closest("button,a")){selectSemi(sc.dataset.sm);return}if(e.target.closest("#tpPhotoBtn")){$("#photoInput").click();return}if(e.target.closest("button,a"))return;const r=e.target.closest("tr.tprow");if(r){tpSel=r.dataset.tp;render()}});
document.addEventListener("paste",e=>{if(mode!=="talent"||!tpSel||!canWrite)return;if(/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName||""))return;const f=[...(e.clipboardData?.files||[])].find(x=>x.type.startsWith("image/"));if(f){e.preventDefault();tpSetPhoto(tpSel,f)}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList?.contains("smcard")){selectSemi(e.target.dataset.sm);return}if(e.target.id==="tpPhotoBtn"&&e.key==="Enter"){$("#photoInput").click();return}const r=e.target.closest?.("tr.tprow");if(r&&e.key==="Enter"){tpSel=r.dataset.tp;render()}});
document.addEventListener("change",async e=>{
  if(e.target.id==="status"){const d=deals.find(x=>x.id===sel);if(!d)return;const from=STATUS[d.status||"new"],to=e.target.value;
    try{await touch(d.id,{status:to});await logH(d.id,"修改状态",`${from} → ${STATUS[to]}`)}catch(err){writeErr(err)}}
  if(e.target.id==="photoInput"){const f=e.target.files[0];e.target.value="";if(f&&tpSel)tpSetPhoto(tpSel,f);return}
  if(e.target.id==="splitSm"){splitSm=e.target.checked;return}
  if(e.target.id==="splitDeal"){splitDeal=e.target.checked;return}
  if(e.target.id==="splitEv"){splitEv=e.target.checked;return}
  if(e.target.id==="fileInput"){const fl=[...e.target.files];e.target.value="";if(pickTarget==="intake")addIntakeFiles(fl);else if(pickTarget==="ev")addEvFiles(fl);else if(pickTarget==="sm")addSmFiles(fl);else if(pickTarget==="replace"){const old=replaceId;replaceId=null;if(fl[0]&&old)replaceFile(old,fl[0])}else{const id0=sel;uploadFiles(fl).then(()=>{if(fl.length&&id0){filesDirty.add(id0);if(sel===id0&&tab==="files")renderMain()}})}}
});
document.addEventListener("keydown",e=>{if(e.target.id==="askBox"&&e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();const v=e.target.value;e.target.value="";sendChat(v)}});
$("#q").addEventListener("input",e=>{query=e.target.value;renderList()});
document.addEventListener("input",e=>{if(e.target.id==="tq"){tq=e.target.value;const b=$("#tpRows");if(b)b.innerHTML=tpRows();return}if(e.target.id==="rq"){rq=e.target.value;const b=$("#rBody");if(b){const pos=e.target.selectionStart;renderMain();const r=$("#rq");if(r){r.focus();try{r.setSelectionRange(pos,pos)}catch(x){}}}return}if(e.target.id==="gq"){gq=e.target.value;const tb=$("#gRows");if(tb)tb.innerHTML=glossRows()}});
const dropZone=e=>e.target.closest?.("#drop,#intakeDrop,#evDrop,#tpDrop,#tpPhotoDrop,#smDrop");
document.addEventListener("dragover",e=>{const z=dropZone(e);if(z){e.preventDefault();z.classList.add("over")}});
document.addEventListener("dragleave",e=>{const z=dropZone(e);if(z&&!z.contains(e.relatedTarget))z.classList.remove("over")});
document.addEventListener("drop",e=>{const z=dropZone(e);if(!z)return;e.preventDefault();z.classList.remove("over");const fl=[...e.dataTransfer.files];if(!fl.length)return;
  if(z.id==="smDrop"){addSmFiles(fl)}else if(z.id==="tpPhotoDrop"){if(tpSel)tpSetPhoto(tpSel,fl.find(f=>f.type.startsWith("image/")))}else if(z.id==="tpDrop"){(async()=>{let txt=($("#tpNotes")?.value||"");for(const f of fl){const p=await prepFile(f);txt+="\n\n=== "+f.name+" ===\n"+p.text}tpExtract(txt)})()}else if(z.id==="intakeDrop"){addIntakeFiles(fl)}else if(z.id==="evDrop"){addEvFiles(fl)}else uploadFiles(fl)});

/* ================= Boot ================= */
render();
(async()=>{
  const c=window.claude;
  if(!c||!c.use){$("#list").innerHTML=`<p class="note" style="padding:16px">请在 claude.ai 中打开这个页面。</p>`;return}
  [db,user,assets,sample]=await Promise.all(["db","user","assets","sample"].map(n=>c.use(n).catch(()=>null)));
  if(user){try{const v=await user.me();me={id:v.id};if(v.id){names.set(v.id,v.name||"我");avatars.set(v.id,v.avatarUrl)}}catch(e){}
    try{const w=await user.can("data.write");if(w===false)canWrite=false}catch(e){}}
  if(!db){$("#list").innerHTML=`<p class="note" style="padding:16px">项目库需要登录 claude.ai 后才能查看。</p>`;canWrite=false;renderMain();return}
  let last="";try{last=localStorage.getItem("dr.sel")||""}catch(e){}
  let first=true;
  db.collection("glossary").onSnapshot(s=>{
    indexGloss(s.docs.map(x=>({id:x.id,...x.data()})));
    const c=$("#gCount");if(c)c.textContent=gloss.length||"";
    if(view==="glossary"){const tb=$("#gRows");if(tb)tb.innerHTML=glossRows();else renderMain()}
    if(tipFor)tip.innerHTML=tipHTML(tipFor);
  },e=>console.warn("glossary",e));
  db.collection("events").onSnapshot(s=>{
    events=s.docs.map(x=>({id:x.id,...x.data()}));
    refreshProfiles(events.flatMap(e=>[e.createdBy,e.updatedBy]));
    if(evSel&&!events.some(e=>e.id===evSel))evSel=null;
    if(mode==="events")render();
  },e=>console.warn("events",e));
  db.collection("semi").onSnapshot(s=>{semis=s.docs.map(x=>({id:x.id,...x.data()}));refreshProfiles(semis.flatMap(x=>[x.createdBy,x.updatedBy]));if(smSel&&!semis.some(x=>x.id===smSel))smSel=null;if(mode==="semi")render()},e=>console.warn("semi",e));
  db.collection("talent").onSnapshot(s=>{talent=s.docs.map(x=>({id:x.id,...x.data()}));refreshProfiles(talent.flatMap(t=>[t.createdBy,t.updatedBy]));if(tpSel&&!talent.some(t=>t.id===tpSel))tpSel=null;if(mode==="talent")render()},e=>console.warn("talent",e));
  db.collection("research").onSnapshot(s=>{research.clear();s.docs.forEach(x=>research.set(x.id,x.data()));if(mode==="events"&&!evSel)renderMain()},e=>console.warn("research",e));
  try{const m0=localStorage.getItem("dr.mode");if(["events","talent","semi"].includes(m0))setMode(m0)}catch(e){}
  db.collection("deals").onSnapshot(s=>{
    deals=s.docs.map(x=>({id:x.id,...x.data()}));
    refreshProfiles(deals.flatMap(d=>[d.updatedBy,d.createdBy,...Object.values(d.memoMeta||{}).map(m=>m.by)]));
    if(first){first=false;if(last&&deals.some(d=>d.id===last)&&window.innerWidth>820){selectDeal(last);return}}
    if(sel&&!deals.some(d=>d.id===sel)){sel=null}
    if(editing&&tab==="memo"){renderList();return}
    if(busy.chat&&tab==="chat"){renderList();return}
    if(mode!=="deals"){if(mode==="events"&&!evSel)renderMain();return}
    render();
  },e=>{$("#list").innerHTML=`<p class="note" style="padding:16px">项目库暂时连不上，请刷新页面。</p>`});
})();
</script>

</body></html>
